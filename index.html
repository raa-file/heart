<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>أطلس القلب التفاعلي | Interactive Heart Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b1220;
    --bg-deep: #070c16;
    --panel: #101a2c;
    --panel-edge: #1c2a44;
    --ivory: #ede6da;
    --ivory-dim: #a9a294;
    --muscle: #b3231c;
    --muscle-bright: #d63a2e;
    --gold: #c9a24b;
    --gold-dim: #8a723a;
    --teal: #2c6e7f;
    --teal-bright: #3f95a8;
    --line: rgba(237,230,218,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background: var(--bg);
    color: var(--ivory);
    font-family: 'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;
    overflow:hidden;
  }
  body[dir="ltr"]{ font-family:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif; }

  ::selection{ background: var(--muscle); color: var(--ivory); }

  /* ---------- Top bar ---------- */
  #topbar{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 28px;
    background: linear-gradient(to bottom, rgba(7,12,22,0.95), rgba(7,12,22,0));
    pointer-events:none;
  }
  #topbar > *{ pointer-events:auto; }
  .brand{
    display:flex; align-items:center; gap:12px;
  }
  .brand .mark{
    width:34px; height:34px; position:relative;
  }
  .brand .mark svg{ width:100%; height:100%; }
  .brand h1{
    font-family:'Newsreader', serif;
    font-weight:600;
    font-size: 19px;
    letter-spacing: 0.01em;
    line-height:1.1;
  }
  .brand .sub{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-top: 2px;
  }

  #controls-top{ display:flex; align-items:center; gap: 10px; }
  .pill-btn{
    background: rgba(16,26,44,0.85);
    border: 1px solid var(--panel-edge);
    color: var(--ivory);
    font-family: inherit;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
    cursor:pointer;
    backdrop-filter: blur(6px);
    transition: border-color .2s ease, background .2s ease;
    display:flex; align-items:center; gap:8px;
  }
  .pill-btn:hover{ border-color: var(--gold-dim); background: rgba(28,42,68,0.9); }
  .pill-btn:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  .pill-btn.active{ border-color: var(--gold); color: var(--gold); }

  /* ---------- Canvas stage ---------- */
  #stage{
    position:fixed; inset:0;
  }
  #stage canvas{ display:block; touch-action:none; }

  #stage-caption{
    position:fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    text-align:center;
    pointer-events:none;
    z-index: 20;
  }
  #stage-caption .hint{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ivory-dim);
    opacity: 0.75;
  }

  /* ---------- ECG ambient line ---------- */
  #ecg-wrap{
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 46px;
    z-index: 15;
    pointer-events: none;
    opacity: 0.55;
    mix-blend-mode: screen;
  }
  #ecg-wrap svg{ width: 200%; height:100%; }
  #ecg-path{
    fill:none;
    stroke: var(--muscle-bright);
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 4px rgba(214,58,46,0.6));
  }
  #ecg-line{
    animation: ecgScroll 6s linear infinite;
  }
  @keyframes ecgScroll{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  /* ---------- Hotspots ---------- */
  .hotspot{
    position:absolute;
    width: 26px; height:26px;
    margin-left:-13px; margin-top:-13px;
    border-radius:50%;
    cursor:pointer;
    z-index: 30;
    display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease;
  }
  .hotspot .ring{
    position:absolute; inset:0;
    border-radius:50%;
    border: 1.5px solid var(--gold);
    animation: hotspotPulse 1.15s cubic-bezier(.4,0,.5,1) infinite;
  }
  .hotspot .core{
    width:9px; height:9px;
    border-radius:50%;
    background: var(--gold);
    box-shadow: 0 0 8px 2px rgba(201,162,75,0.75);
  }
  .hotspot:hover .core, .hotspot.active .core{
    background: var(--muscle-bright);
    box-shadow: 0 0 12px 3px rgba(214,58,46,0.85);
  }
  .hotspot:hover, .hotspot.active{ transform: scale(1.15); }
  .hotspot.active .ring{ border-color: var(--muscle-bright); }
  .hotspot:focus-visible{ outline: 2px solid var(--gold); outline-offset: 3px; }

  @keyframes hotspotPulse{
    0%   { transform: scale(0.55); opacity: 0.9; }
    70%  { transform: scale(1.9); opacity: 0; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  .hotspot-label{
    position:absolute;
    top: 32px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: var(--ivory);
    background: rgba(7,12,22,0.85);
    border: 1px solid var(--panel-edge);
    padding: 4px 9px;
    border-radius: 5px;
    pointer-events:none;
    opacity:0;
    transition: opacity .15s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .hotspot-label .hint-line{
    font-size: 8.5px;
    color: var(--gold);
    letter-spacing: 0.06em;
  }
  .hotspot:hover .hotspot-label{ opacity: 1; }

  /* ---------- Detail Panel ---------- */
  #panel{
    position: fixed;
    top: 0;
    inset-inline-end: 0;
    height: 100%;
    width: min(460px, 100%);
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-deep) 100%);
    border-inline-start: 1px solid var(--panel-edge);
    box-shadow: -30px 0 60px rgba(0,0,0,0.45);
    z-index: 40;
    transform: translateX(105%);
    transition: transform .42s cubic-bezier(.22,.68,0,1);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  body[dir="rtl"] #panel{ transform: translateX(-105%); }
  #panel.open{ transform: translateX(0); }

  #panel-scroll{
    overflow-y:auto;
    padding: 92px 34px 40px;
    flex:1;
  }
  #panel-scroll::-webkit-scrollbar{ width:6px; }
  #panel-scroll::-webkit-scrollbar-thumb{ background: var(--panel-edge); border-radius: 3px; }

  #panel-close{
    position:absolute;
    top: 20px;
    inset-inline-end: 22px;
    width: 34px; height:34px;
    border-radius: 50%;
    background: rgba(16,26,44,0.9);
    border: 1px solid var(--panel-edge);
    color: var(--ivory);
    font-size: 16px;
    cursor:pointer;
    z-index: 5;
  }
  #panel-close:hover{ border-color: var(--gold); color: var(--gold); }

  .panel-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    display:flex; align-items:center; gap:10px;
    margin-bottom: 10px;
  }
  .panel-eyebrow .dot{
    width:6px; height:6px; border-radius:50%; background:var(--gold);
  }
  #panel-title-ar{
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-weight:700;
    font-size: 26px;
    line-height:1.25;
    margin-bottom: 3px;
  }
  #panel-title-en{
    font-family:'Newsreader', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 15px;
    color: var(--ivory-dim);
    margin-bottom: 22px;
  }

  .panel-section{
    margin-bottom: 26px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .panel-section:last-child{ border-bottom:none; }
  .panel-section h3{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--teal-bright);
    margin-bottom: 10px;
  }
  .panel-section p{
    font-size: 14.5px;
    line-height: 1.85;
    color: var(--ivory);
  }
  .panel-section p + p{ margin-top:10px; }
  .panel-section ul{
    list-style:none;
    display:flex; flex-direction:column; gap:8px;
  }
  .panel-section li{
    font-size: 14px;
    line-height:1.7;
    padding-inline-start: 16px;
    position:relative;
  }
  .panel-section li::before{
    content:'';
    position:absolute;
    inset-inline-start:0;
    top: 9px;
    width:5px; height:5px;
    border-radius:1px;
    background: var(--muscle-bright);
    transform: rotate(45deg);
  }
  .clinical-box{
    background: rgba(179,35,28,0.08);
    border: 1px solid rgba(179,35,28,0.35);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .clinical-box h3{ color: var(--muscle-bright); }
  .clinical-box p{ font-size:13.5px; }

  .stat-row{
    display:flex; gap: 10px; flex-wrap:wrap;
    margin-bottom: 22px;
  }
  .stat{
    flex:1; min-width: 110px;
    background: rgba(201,162,75,0.06);
    border:1px solid rgba(201,162,75,0.25);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .stat .num{
    font-family:'Newsreader', serif;
    font-size: 20px;
    color: var(--gold);
    display:block;
  }
  .stat .lbl{
    font-family:'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    color: var(--ivory-dim);
    text-transform: uppercase;
  }

  /* ---------- Intro overlay ---------- */
  #intro{
    position:fixed; inset:0; z-index:100;
    background: var(--bg-deep);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 22px;
    transition: opacity .6s ease, visibility .6s ease;
  }
  #intro.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  #intro .mark-big{ width:64px; height:64px; opacity:0.9; }
  #intro .mark-big svg{ width:100%; height:100%; }
  #intro-status{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ivory-dim);
  }
  #intro-bar{
    width: 220px; height:2px;
    background: var(--panel-edge);
    position:relative;
    overflow:hidden;
    border-radius:2px;
  }
  #intro-bar-fill{
    position:absolute; inset-inline-start:0; top:0; bottom:0;
    width:0%;
    background: var(--muscle-bright);
    transition: width .3s ease;
  }

  /* ---------- Legend ---------- */
  #legend{
    position: fixed;
    bottom: 26px;
    inset-inline-start: 28px;
    z-index: 20;
    display:flex;
    flex-direction:column;
    gap: 7px;
  }
  .legend-item{
    display:flex; align-items:center; gap: 9px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.03em;
    color: var(--ivory-dim);
  }
  .legend-swatch{
    width: 10px; height:10px; border-radius:2px;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 720px){
    #topbar{ padding: 14px 16px; }
    .brand h1{ font-size:15px; }
    .brand .sub{ display:none; }
    .pill-btn{ padding: 8px 12px; font-size:12px; }
    #panel{ width:100%; }
    #panel-scroll{ padding: 84px 22px 36px; }
    #legend{ display:none; }
    #stage-caption{ display:none; }
  }

  [hidden]{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    .ring{ animation: none !important; }
    #ecg-line{ animation: none !important; }
  }
</style>
</head>

<script>
  window.addEventListener('error', function(e){
    const s = document.getElementById('intro-status');
    const b = document.getElementById('intro-bar');
    if(s){ s.textContent = 'حدث خطأ أثناء تحميل النموذج: ' + (e.message || 'unknown'); }
    if(b){ b.style.display = 'none'; }
  });
</script>

pvPositions.forEach((p,i)=>{
  const m = makeTube([
    [p[0]*0.55, p[1]*0.55+0.3, p[2]*0.55],
    p
  ], 0.09, veinMat, 10, 10);
  heartGroup.add(m);
});

// Coronary artery hint — thin curved line across anterior surface (LAD)
const ladCurvePts = [
  [0.1, 1.0, 0.85],
  [0.0, 0.4, 0.95],
  [-0.05, -0.3, 0.9],
  [-0.1, -1.1, 0.55]
];
const ladMesh = makeTube(ladCurvePts, 0.045, goldAccent, 30, 8);
heartGroup.add(ladMesh);

heartGroup.rotation.y = -0.35;
heartGroup.position.y = -0.15;

/* =========================================================
   HOTSPOTS — projected from local marker positions
   ========================================================= */
const hotspotLayer = document.getElementById('hotspot-layer');
const hotspotEls = {};

MARKERS.forEach(m => {
  const el = document.createElement('button');
  el.className = 'hotspot';
  el.setAttribute('aria-label', HEART_DATA[m.id].title_ar);
  el.dataset.id = m.id;
  el.innerHTML = `<span class="ring"></span><span class="core"></span><span class="hotspot-label">${HEART_DATA[m.id].title_ar}<span class="hint-line" data-ar="اضغط للتفاصيل الكاملة" data-en="Tap for full details">اضغط للتفاصيل الكاملة</span></span>`;
  el.addEventListener('click', () => openPanel(m.id));
  hotspotLayer.appendChild(el);
  hotspotEls[m.id] = el;
});

const _v = new THREE.Vector3();
function updateHotspots(){
  MARKERS.forEach(m => {
    _v.set(m.pos[0], m.pos[1], m.pos[2]);
    heartGroup.localToWorld(_v);
    const behind = isBehindCamera(_v);
    _v.project(camera);
    const x = (_v.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-_v.y * 0.5 + 0.5) * window.innerHeight;
    const el = hotspotEls[m.id];
    if(behind || _v.z > 1){
      el.style.display = 'none';
    } else {
      el.style.display = 'flex';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    }
  });
}
function isBehindCamera(worldPos){
  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  const toPoint = worldPos.clone().sub(camera.position);
  return toPoint.dot(camDir) < 0;
}

/* =========================================================
   PANEL
   ========================================================= */
const panel = document.getElementById('panel');
const panelClose = document.getElementById('panel-close');
let activeId = null;

function renderPanel(id){
  const d = HEART_DATA[id];
  document.getElementById('panel-eyebrow-text').textContent = currentLang === 'ar' ? d.eyebrow.ar : d.eyebrow.en;
  document.getElementById('panel-title-ar').textContent = currentLang === 'ar' ? d.title_ar : d.title_en;
  document.getElementById('panel-title-en').textContent = currentLang === 'ar' ? d.title_en : d.title_ar;

  const statsWrap = document.getElementById('panel-stats');
  statsWrap.innerHTML = '';
  d.stats.forEach(s => {
    const div = document.createElement('div');
    div.className = 'stat';
    div.innerHTML = `<span class="num">${s.num}</span><span class="lbl">${currentLang==='ar' ? s.lbl_ar : s.lbl_en}</span>`;
    statsWrap.appendChild(div);
  });

  const body = document.getElementById('panel-body');
  body.innerHTML = '';
  d.sections.forEach(sec => {
    const div = document.createElement('div');
    div.className = 'panel-section' + (sec.clinical ? ' clinical-box' : '');
    let html = `<h3>${currentLang==='ar' ? sec.h_ar : sec.h_en}</h3>`;
    if(sec.p_ar || sec.p_en){
      html += `<p>${currentLang==='ar' ? sec.p_ar : sec.p_en}</p>`;
    }
    if(sec.p_ar2){
      html += `<p>${currentLang==='ar' ? sec.p_ar2 : ''}</p>`;
    }
    if(sec.list_ar || sec.list_en){
      const items = currentLang==='ar' ? sec.list_ar : sec.list_en;
      html += '<ul>' + items.map(it => `<li>${it}</li>`).join('') + '</ul>';
    }
    div.innerHTML = html;
    body.appendChild(div);
  });
}

function openPanel(id){
  activeId = id;
  Object.values(hotspotEls).forEach(el => el.classList.remove('active'));
  hotspotEls[id].classList.add('active');
  renderPanel(id);
  panel.classList.add('open');
  controls.autoRotate = false;
}
function closePanel(){
  panel.classList.remove('open');
  if(activeId) hotspotEls[activeId].classList.remove('active');
  activeId = null;
}
panelClose.addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closePanel(); });

/* =========================================================
   LANGUAGE TOGGLE
   ========================================================= */
const btnLang = document.getElementById('btn-lang');
function applyLang(lang){
  currentLang = lang;
  document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = lang;
  btnLang.textContent = lang === 'ar' ? 'EN' : 'AR';
  document.querySelectorAll('[data-ar]').forEach(el => {
    el.textContent = lang === 'ar' ? el.dataset.ar : el.dataset.en;
  });
  Object.entries(HEART_DATA).forEach(([id, d]) => {
    const labelEl = hotspotEls[id].querySelector('.hotspot-label');
    const hintText = lang === 'ar' ? 'اضغط للتفاصيل الكاملة' : 'Tap for full details';
    labelEl.innerHTML = `${lang === 'ar' ? d.title_ar : d.title_en}<span class="hint-line">${hintText}</span>`;
    hotspotEls[id].setAttribute('aria-label', lang === 'ar' ? d.title_ar : d.title_en);
  });
  if(activeId) renderPanel(activeId);
}
btnLang.addEventListener('click', () => applyLang(currentLang === 'ar' ? 'en' : 'ar'));

/* ---------- Reset view ---------- */
document.getElementById('btn-reset').addEventListener('click', () => {
  camera.position.set(0, 0.4, 9.5);
  controls.target.set(0, -0.1, 0);
  controls.autoRotate = true;
});
controls.addEventListener('start', () => { controls.autoRotate = false; });

/* ---------- Cross-section toggle ---------- */
const btnSection = document.getElementById('btn-section');
btnSection.addEventListener('click', () => {
  sectionMode = !sectionMode;
  applyClipping();
  btnSection.classList.toggle('active', sectionMode);
});

/* =========================================================
   RESIZE + RENDER LOOP
   ========================================================= */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let firstFrameRendered = false;
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  // gentle ambient heartbeat scale pulse on the whole mesh
  const t = performance.now() / 1000;
  heartGroup.scale.setScalar(1 + Math.sin(t*1.35)*0.008);
  updateHotspots();
  renderer.render(scene, camera);
  if(!firstFrameRendered){
    firstFrameRendered = true;
    hideIntro();
  }
}

/* =========================================================
   INTRO / LOADING SEQUENCE — reflects the real render loop,
   not a fake timer, so it can never hang while secretly ready.
   ========================================================= */
const introEl = document.getElementById('intro');
const introBarFill = document.getElementById('intro-bar-fill');
let progress = 0;
const introTimer = setInterval(() => {
  progress = Math.min(progress + Math.random()*18 + 8, 92);
  introBarFill.style.width = progress + '%';
}, 160);

function hideIntro(){
  clearInterval(introTimer);
  introBarFill.style.width = '100%';
  setTimeout(() => introEl.classList.add('hidden'), 220);
}

// Safety net: if something silently prevents the first frame from
// ever rendering, surface a message instead of hanging forever.
setTimeout(() => {
  if(!firstFrameRendered){
    document.getElementById('intro-status').textContent = 'التحميل يستغرق وقتًا أطول من المعتاد — تأكدي من الاتصال بالإنترنت.';
  }
}, 8000);

animate();
</script>
</body>
</html>
